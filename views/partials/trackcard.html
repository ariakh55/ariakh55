<div class="track-card">
    <img class="thumbnail" data-thumbid="{{track.id}}" src="" alt="ART FOR {{track.album}}">

    <div class="info"
        hx-trigger="load once queue:all"
        hx-get="/playlist/{{track.mbid}}/"
        hx-swap="outerHTML"
        hx-target="img[data-thumbid='{{track.id}}']"
    >
        <a href="{{track.link}}" rel="noref" target="_blank">{{track.title}}</a>
        <p><str><span class="icon"></span> Artist:</str> {{track.artist}}</p>
        <p><str><span class="icon">󰀥</span> Album:</str> {{track.album}}</p>
    </div>
</div>
