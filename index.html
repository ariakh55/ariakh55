<body style="display: flex; flex-direction: column;">
    <header>
        <nav id="nav">
            <a href="#/home">HOME</a>
            <a href="#/resume">RESUME</a>
            <a href="#/blogs">BLOGS</a>
        </nav>
    </header>

        <div class="footer-info">

            <div>
                Contact me directly @ <a href="mailto:khoshnoodaria@outlook.com">MY Email</a>
            </div>
        </div>
    </footer>

    <script>
        (function () {
            var ROUTES = {
                home: 'static/home.html',
                resume: 'static/resume.html',
                blogs: 'static/blogs.html',
            };

            function fragmentForHash(hash) {
                var raw = (hash || '').replace(/^#\/?/, '');
                if (!raw) return ROUTES.home;

                var parts = raw.split('/');
                var name = decodeURIComponent(parts[0]);

                if (name === 'blog' && parts[1]) {
                    return 'static/blog-' + decodeURIComponent(parts[1]) + '.html';
                }

                return ROUTES[name] || 'static/error.html';
            }

            function currentRouteName() {
                var raw = (location.hash || '').replace(/^#\/?/, '');
                return raw.split('/')[0] || 'home';
            }

            function highlightActive() {
                var active = currentRouteName();
                var links = document.querySelectorAll('#nav > a');
                links.forEach(function (a) {
                    if (a.getAttribute('href') === '#/' + active) {
                        a.setAttribute('aria-current', 'page');
                    } else {
                        a.removeAttribute('aria-current');
                    }
                });
            }

            function load() {
                var file = fragmentForHash(location.hash);
                htmx.ajax('GET', file, { target: '#content', swap: 'innerHTML' });
                highlightActive();
                window.scrollTo(0, 0);
            }

            window.addEventListener('hashchange', load);

            document.addEventListener('DOMContentLoaded', function () {
                if (!location.hash) {
                    history.replaceState(null, '', '#/home');
                }
                load();
            });
        })();
    </script>
</body>

</html>
